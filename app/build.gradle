plugins { id 'com.android.application' }
android {
    namespace 'com.example.kokorotest'
    compileSdk 34
    defaultConfig { applicationId 'com.example.kokorotest'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    signingConfigs {
        fixed { storeFile file('test.keystore'); storePassword 'android'; keyAlias 'testkey'; keyPassword 'android' }
    }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
